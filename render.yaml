# Render Blueprint: the jury demo as a static site (frontend only, demo engine, no backend).
services:
  - type: web
    name: kbc-takes-care
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build:jury
    staticPublishPath: dist-jury
    pullRequestPreviewsEnabled: false
    buildFilter:
      paths:
        - frontend/**
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Frame-Options
        value: DENY
